name: Build RoundBlocks 1.0.1
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Extract corrected source archive
        shell: bash
        run: |
          if [ -f RoundBlocks-source-fixed4.zip ]; then
            unzip -oq RoundBlocks-source-fixed4.zip -d .
          fi
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build mod
        run: gradle clean build --no-daemon
      - name: Build 2048px PBR resource pack
        run: |
          python3 -m pip install --disable-pip-version-check Pillow
          python3 tools/make_resourcepack.py
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RoundBlocks-1.0.1-build
          path: |
            build/libs/roundblocks-1.0.1.jar
            build/libs/roundblocks-1.0.1-sources.jar
            RoundBlocks-PBR-2048.zip
          if-no-files-found: error
